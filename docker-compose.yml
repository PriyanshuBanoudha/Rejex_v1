version: '3.9'

services:
  mongo:
    image: mongo:7-jammy
    container_name: hackathon_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hackathon
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hackathon_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackathon_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/hackathon
      JWT_SECRET: hackathon-super-secret-jwt-change-in-production
      JWT_REFRESH_SECRET: hackathon-refresh-secret-change-in-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '5000:5000'
    networks:
      - hackathon_net
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:5000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathon_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3000:80'
    networks:
      - hackathon_net

volumes:
  mongo_data:
    driver: local

networks:
  hackathon_net:
    driver: bridge
